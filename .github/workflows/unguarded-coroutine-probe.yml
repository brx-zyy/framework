name: Eloquent coroutine security regression probes
on:
  push:
    branches: ['security/repro-eloquent-unguarded-coroutine-*']
    paths: ['.github/security-tests/unguarded-coroutine-server.php', '.github/workflows/unguarded-coroutine-probe.yml']
  pull_request:
    branches: ['13.x']
    paths: ['.github/security-tests/unguarded-coroutine-server.php', '.github/workflows/unguarded-coroutine-probe.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: password, MYSQL_DATABASE: laravel_test }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_test
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP with MySQL PDO and OpenSwoole
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, filter, hash, mbstring, openssl, session, tokenizer, pdo_mysql, swoole
          coverage: none
          tools: composer:v2
      - name: Install framework runtime dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev
      - name: Start isolated OpenSwoole + MySQL server
        run: |
          php .github/security-tests/unguarded-coroutine-server.php > /tmp/unguarded-server.log 2>&1 &
          echo $! > /tmp/unguarded-server.pid
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:9501/health; then echo; exit 0; fi
            sleep 0.5
          done
          cat /tmp/unguarded-server.log
          exit 1
      - name: Verify sequential mass-assignment protection
        run: |
          result="$(curl --silent --show-error -X POST http://127.0.0.1:9501/baseline)"
          echo "Sequential control: $result"
          echo "$result" | grep -q '"is_admin":0'
      - name: Test forceCreate race during real PDO MySQL suspension
        run: |
          set -e
          curl --silent --show-error -X POST http://127.0.0.1:9501/force > /tmp/force-result.json &
          pid=$!
          sleep 0.3
          curl --silent --show-error -X POST http://127.0.0.1:9501/ordinary > /tmp/ordinary-result.json
          wait "$pid"
          echo "Force request: $(cat /tmp/force-result.json)"
          echo "Concurrent ordinary request: $(cat /tmp/ordinary-result.json)"
          grep -q '"is_admin":1' /tmp/ordinary-result.json
          echo "## MySQL PDO forceCreate race: REPRODUCED" >> "$GITHUB_STEP_SUMMARY"
      - name: Test withoutEvents race during real PDO MySQL suspension
        run: |
          set -e
          control="$(curl --silent --show-error -X POST http://127.0.0.1:9501/ordinary-quiet)"
          echo "Observer control (no quiet context): $control"
          echo "$control" | grep -q '"observer_seen":1'
          curl --silent --show-error -X POST http://127.0.0.1:9501/quiet > /tmp/quiet-result.json &
          pid=$!
          sleep 0.3
          curl --silent --show-error -X POST http://127.0.0.1:9501/ordinary-quiet > /tmp/ordinary-quiet-result.json
          wait "$pid"
          echo "Quiet request: $(cat /tmp/quiet-result.json)"
          echo "Concurrent ordinary create: $(cat /tmp/ordinary-quiet-result.json)"
          grep -q '"observer_seen":0' /tmp/ordinary-quiet-result.json
          echo "## withoutEvents observer suppression race: REPRODUCED" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve reproduction evidence
        if: always()
        run: |
          mkdir -p /tmp/eloquent-race-evidence
          cp /tmp/unguarded-server.log /tmp/eloquent-race-evidence/ 2>/dev/null || true
          cp /tmp/force-result.json /tmp/eloquent-race-evidence/ 2>/dev/null || true
          cp /tmp/ordinary-result.json /tmp/eloquent-race-evidence/ 2>/dev/null || true
          cp /tmp/quiet-result.json /tmp/eloquent-race-evidence/ 2>/dev/null || true
          cp /tmp/ordinary-quiet-result.json /tmp/eloquent-race-evidence/ 2>/dev/null || true
          { echo "PHP: $(php -v | head -n 1)"; php --ri swoole | head -n 18 || true; php -m | grep -E 'PDO|pdo_mysql|swoole' || true; } > /tmp/eloquent-race-evidence/runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eloquent-coroutine-mysql-evidence
          path: /tmp/eloquent-race-evidence/
          if-no-files-found: warn
